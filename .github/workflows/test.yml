name: Test Token Permissions

on:
  workflow_dispatch: # Manual trigger

jobs:
  test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensure write permission to contents
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create test file
        run: |
          mkdir -p test-files
          echo "This is a test file" > test-files/test.txt
          echo "TEST_TAG=test-tag-$(date +%s)" >> $GITHUB_ENV
      
      # Test 1: Try to use the API directly
      - name: Test API access
        run: |
          echo "Testing API access with GITHUB_TOKEN..."
          gh api /repos/${{ github.repository }}/releases --method GET || echo "API access failed, but continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Test 2: Try to create a tag with git
      - name: Test Git tag creation
        run: |
          echo "Testing git tag creation..."
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          echo "Creating tag: ${{ env.TEST_TAG }}"
          git tag ${{ env.TEST_TAG }}
          git push origin ${{ env.TEST_TAG }} || echo "Git tag push failed, but continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Test 3: Try to create a release with gh cli
      - name: Test GitHub CLI release creation
        run: |
          echo "Testing gh release creation..."
          gh release create ${{ env.TEST_TAG }} \
            --title "Test Release" \
            --notes "This is a test release created via GitHub CLI" \
            --draft \
            test-files/test.txt || echo "GH release failed, but continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Test 4: Try to create a release with action
      - name: Test GitHub release action
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TEST_TAG }}-action
          name: "Test Release via Action"
          draft: true
          files: test-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Summary
      - name: Summary
        run: |
          echo "All tests completed. Check the repository for created tags and releases."