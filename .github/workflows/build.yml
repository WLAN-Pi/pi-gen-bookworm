name: Build wlan(pi-gen) bookworm image
on:
  workflow_dispatch:
    inputs:
      repos:
        descriptions: Repos to include
        required: true
        type: choice
        options:
          - both
          - main
        default: both
jobs:
  build-prep:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check if inputs choice exists
        run: |
          CHOICE=${{ github.event.inputs.repos }}
          if [ -z "$CHOICE" ]; then
            echo "Error: inputs choice not found"
            exit 1
          fi
          echo "REPOS=$CHOICE" >> $GITHUB_ENV
      - name: Set repos choice variable
        run: |
          echo "Repos choice: $REPOS"
          if [ "$REPOS" = "both" ]; then
            echo 'INCLUDE_PACKAGECLOUD_DEV=1' >> $GITHUB_OUTPUT
          else
            echo 'INCLUDE_PACKAGECLOUD_DEV=0' >> $GITHUB_OUTPUT
          fi
  build-image:
    runs-on: ubuntu-24.04-arm
    needs:
      - build-prep
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            coreutils \
            quilt \
            parted \
            qemu-user-static \
            debootstrap \
            zerofree \
            zip \
            dosfstools \
            libarchive-tools \
            libcap2-bin \
            rsync \
            grep \
            xz-utils \
            file \
            curl \
            cpio \
            python3 \
            python3-pip \
            jq \
            binfmt-support \
            systemd-container \
            arch-test
      - name: Grant Execution Permissions
        run: chmod +x build.sh
      - name: Run Build Script as Root
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          sudo ./build.sh
      - name: Calculate version and checksums
        id: vercheck
        run: |
          VERSION=$(date '+%Y.%m.%d')-$(git rev-parse --short HEAD)-$GITHUB_RUN_NUMBER
          echo "version=$VERSION" >> $GITHUB_ENV
          mkdir -p processed
          for IMG in deploy/*.img.gz; do
            if [ -f "$IMG" ]; then
              BASE=$(basename "$IMG")
              if [[ "$BASE" == *"-lite.img.gz" ]]; then
                TYPE="lite"
              elif [[ "$BASE" == *"-full.img.gz" ]]; then
                TYPE="full"
              else
                continue
              fi

              NEW="wlanpi-os-$TYPE-$VERSION.img.gz"
              cp "$IMG" "processed/$NEW"

              INFO="${IMG%.img.gz}.info"
              if [ -f "$INFO" ]; then
                NEW_INFO="wlanpi-os-$TYPE-$VERSION.info"
                cp "$INFO" "processed/$NEW_INFO"
              fi

              pushd processed
              sha256sum "$NEW" > "$NEW.sha256"
              md5sum "$NEW" > "$NEW.md5"
              popd
            fi
          done

          echo "Processed:"
          ls -la processed/
      - name: Upload WLAN Pi Lite Image
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-lite-${{ env.version }}
          path: processed/wlanpi-os-lite-*.img.gz

      - name: Upload WLAN Pi Lite Info
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-lite-info-${{ env.version }}
          path: processed/wlanpi-os-lite-*.info

      - name: Upload WLAN Pi Lite Checksums
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-lite-checksums-${{ env.version }}
          path: processed/wlanpi-os-lite-*.{sha256,md5}

      - name: Upload WLAN Pi Full Image
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-full-${{ env.version }}
          path: processed/wlanpi-os-full-*.img.gz

      - name: Upload WLAN Pi Full Info
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-full-info-${{ env.version }}
          path: processed/wlanpi-os-full-*.info

      - name: Upload WLAN Pi Full Checksums
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-full-checksums-${{ env.version }}
          path: processed/wlanpi-os-full-*.{sha256,md5}

      - name: Archive and Upload All Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wlanpi-os-original-${{ env.version }}
          path: deploy/
  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - build-image
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}